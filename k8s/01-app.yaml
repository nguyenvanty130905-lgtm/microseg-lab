apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: microseg}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db, tier: db}}
    spec:
      containers:
      - name: db
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: notes}
        - {name: POSTGRES_USER, value: app}
        - {name: POSTGRES_PASSWORD, value: app_pw}
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: microseg}
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: microseg}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, tier: api}}
    spec:
      containers:
      - name: api
        image: microseg/api:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        readinessProbe:
          tcpSocket: {port: 8000}
          initialDelaySeconds: 3
          periodSeconds: 3
        env:
        - {name: DB_HOST, value: db}
        - {name: DB_NAME, value: notes}
        - {name: DB_USER, value: app}
        - {name: DB_PASSWORD, value: app_pw}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: microseg}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: microseg}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, tier: web}}
    spec:
      containers:
      - name: web
        image: microseg/web:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: microseg}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]

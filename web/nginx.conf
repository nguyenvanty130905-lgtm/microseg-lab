server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api/xyz  ->  http://api:8000/xyz
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
